name = "security-triage"
description = "Cheap-tier classifier for push-time security / Bugbot findings on open PRs. Allowlisted bots only (Bugbot, security-guidance, Dependabot security, GitHub code scanning) — not CodeRabbit-style nits. Classifies each finding to babysit / ignore / needs you. Does not edit code or reopen the PR-opening gate. Spawned by /triage-security; not a substitute for local /review-bugbot skills."
