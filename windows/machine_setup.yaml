  davinci_resolve_download_page:
    os: [windows]
    commands:
      - run:
          install:
            - |
              $ErrorActionPreference = 'Stop'
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $release = Invoke-RestMethod -Uri 'https://www.blackmagicdesign.com/api/support/latest-stable-version/davinci-resolve/Windows'
              $releaseId = $release.Windows.releaseId
              if ($releaseId -notmatch '^[0-9a-fA-F]{32}$') {
                throw 'Blackmagic returned an invalid release ID.'
              }
              $downloadPage = "https://www.blackmagicdesign.com/support/download/$releaseId/Windows"
              Write-Host 'Complete the registration form and save the installer in Downloads, then extract and install DaVinci Resolve manually.'
              Start-Process $downloadPage
