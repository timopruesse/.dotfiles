---
default_shell: "zsh"
# Independent tasks run concurrently. depends_on builds layers so apt/brew
# prerequisites and git@ clones still serialize correctly. Cross-platform
# tasks list both OS-specific prereqs; the wrong-OS task is skipped.
parallel: true

tasks:
  homebrew_macos:
    os: ["macos"]
    commands:
      - run:
          commands:
            - '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
            - 'eval "$(/opt/homebrew/bin/brew shellenv)"'

  homebrew_linux:
    os: ["linux"]
    commands:
      - run:
          env:
            TMP_INSTALL_PATH: "/tmp/install-brew.sh"
          commands:
            - "wget -O $TMP_INSTALL_PATH https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
            - "chmod u+x $TMP_INSTALL_PATH"
            - "$TMP_INSTALL_PATH"
            - "rm $TMP_INSTALL_PATH"
            - 'rm -rf "/home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/homebrew/homebrew-core"'
            - "brew tap homebrew/core"
            - 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'

  # Apt base (linux): zsh → apt_repos (all third-party sources + one update) →
  # tools / gh / chrome / go / python / docker fan out in parallel.
  zsh_linux:
    os: ["linux"]
    commands:
      - run:
          shell: "bash"
          commands:
            - "sudo apt-get update"
            - "sudo apt-get install -y zsh"
            - 'sudo chsh -s "$(command -v zsh)" "${USER}"'
      - clone:
          url: "https://github.com/agkozak/zcomet.git"
          target: "~/.zcomet/bin"

  # Single place for third-party apt sources so we only `apt-get update` once.
  apt_repos_linux:
    os: ["linux"]
    depends_on: ["zsh_linux"]
    commands:
      - run:
          install:
            - "sudo apt-get install -y ca-certificates curl wget gnupg software-properties-common apt-transport-https"
            - "sudo add-apt-repository -y ppa:git-core/ppa"
            - "sudo mkdir -p -m 755 /etc/apt/keyrings"
            - "wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null"
            - "sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg"
            - 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null'
            - "wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg"
            - "sudo chmod go+r /etc/apt/keyrings/google-chrome.gpg"
            - 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null'
            - "sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc"
            - "sudo chmod a+r /etc/apt/keyrings/docker.asc"
            - 'echo "Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: $(. /etc/os-release && echo ${UBUNTU_CODENAME:-$VERSION_CODENAME})\nComponents: stable\nArchitectures: $(dpkg --print-architecture)\nSigned-By: /etc/apt/keyrings/docker.asc" | sudo tee /etc/apt/sources.list.d/docker.sources > /dev/null'
            - "sudo apt-get update"
          update:
            - "sudo apt-get update"

  zsh_macos:
    os: ["macos"]
    depends_on: ["tools_macos"]
    commands:
      - run:
          commands:
            - 'sudo chsh -s "$(command -v zsh)" "${USER}"'
      - clone:
          url: "https://github.com/agkozak/zcomet.git"
          target: "~/.zcomet/bin"

  wsl_config:
    os: ["linux"]
    commands:
      - copy:
          src: "./etc/wsl.conf"
          target: "/etc/wsl.conf"
          sudo: true

  # Windows-side WSL2 limits (%UserProfile%\.wslconfig). Takes effect after `wsl --shutdown`.
  wsl_user_config:
    os: ["linux"]
    commands:
      - copy:
          src: "./etc/wslconfig"
          target: "/mnt/c/Users/Timo/.wslconfig"

  win32yank_wsl:
    os: ["linux"]
    depends_on: ["tools_linux"]
    commands:
      - run:
          env:
            TMP_ZIP: "/tmp/win32yank.zip"
          install:
            - 'if [ -x "$HOME/.local/bin/win32yank.exe" ]; then echo "win32yank already installed"; else mkdir -p "$HOME/.local/bin" && curl -fsSL -o "$TMP_ZIP" https://github.com/equalsraf/win32yank/releases/download/v0.1.1/win32yank-x64.zip && unzip -p "$TMP_ZIP" win32yank.exe > "$HOME/.local/bin/win32yank.exe" && chmod +x "$HOME/.local/bin/win32yank.exe" && rm -f "$TMP_ZIP"; fi'
          uninstall:
            - "rm -f $HOME/.local/bin/win32yank.exe"

  windows_terminal:
    os: ["linux"]
    commands:
      - run:
          shell: "bash"
          env:
            SETTINGS_PATH: "/mnt/c/Users/Timo/AppData/Local/Packages/Microsoft.WindowsTerminalPreview_8wekyb3d8bbwe/LocalState/settings.json"
          commands:
            - "rm -f $SETTINGS_PATH"
      # symlink doesn't work after the settings were changed via UI
      # Apparently, the file gets regenerated instead of changed
      - copy:
          src: "./terminal"
          target: "/mnt/c/Users/Timo/AppData/Local/Packages/Microsoft.WindowsTerminalPreview_8wekyb3d8bbwe/LocalState"

  ssh:
    os: ["linux"]
    commands:
      - copy:
          src: "/mnt/c/Users/Timo/OneDrive/Dokumente/_DEV/.ssh"
          target: "~/.ssh"
      - run:
          install:
            - "chmod 700 ~/.ssh"
            - "chmod 600 ~/.ssh/id_rsa"
            - "chmod 644 ~/.ssh/id_rsa.pub"

  tools_linux:
    os: ["linux"]
    depends_on: ["apt_repos_linux"]
    commands:
      - run:
          install:
            - "sudo apt-get install -y git fuse ripgrep fzf fd-find bat git-delta unzip apt-transport-https lsb-release ca-certificates wget software-properties-common keychain xclip libssl-dev cmake pkg-config build-essential eza fswatch luarocks libclang-dev wslu xdg-utils"
            - "curl -sS https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | bash"
            - "sudo locale-gen en_US.UTF-8"
          update:
            - "sudo apt-get update"
            - "sudo apt-get upgrade -y"
            - "sudo apt-get install -y git fuse ripgrep fzf fd-find bat git-delta unzip apt-transport-https lsb-release ca-certificates wget software-properties-common keychain xclip libssl-dev cmake pkg-config build-essential eza fswatch luarocks libclang-dev wslu xdg-utils"

  # Single brew lock: all macOS formulas/casks live in ./Brewfile.
  tools_macos:
    os: ["macos"]
    depends_on: ["homebrew_macos"]
    commands:
      - run:
          install:
            - 'brew bundle --file="${DOTFILES:-.}/Brewfile"'
          update:
            - 'brew bundle --file="${DOTFILES:-.}/Brewfile"'
            - "brew upgrade"
            - "brew upgrade --fetch-HEAD neovim"

  atuin_linux:
    os: ["linux"]
    depends_on: ["apt_repos_linux"]
    commands:
      - run:
          # Official binary installer → ~/.atuin/bin. NO_MODIFY_PATH: .zshrc is
          # managed by dotfiles (already has atuin init + PATH).
          install:
            - "ATUIN_NO_MODIFY_PATH=1 curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | ATUIN_NO_MODIFY_PATH=1 sh -s -- --non-interactive"
          update:
            - "atuin update || ATUIN_NO_MODIFY_PATH=1 curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | ATUIN_NO_MODIFY_PATH=1 sh -s -- --non-interactive"
          uninstall:
            - "rm -rf ~/.atuin"

  gh_linux:
    os: ["linux"]
    depends_on: ["apt_repos_linux"]
    commands:
      - run:
          install:
            - "sudo apt-get install -y gh"
          update:
            - "sudo apt-get upgrade -y gh"
          uninstall:
            - "sudo apt-get remove -y gh"

  # Google Chrome — required by the chrome-devtools MCP server. Uses Google's
  # apt repo (registered in apt_repos_linux) so `apt upgrade` keeps it current.
  chrome_linux:
    os: ["linux"]
    depends_on: ["apt_repos_linux"]
    commands:
      - run:
          install:
            - "sudo apt-get install -y google-chrome-stable"
          update:
            - "sudo apt-get upgrade -y google-chrome-stable"
          uninstall:
            - "sudo apt-get remove -y google-chrome-stable"
            - "sudo rm -f /etc/apt/sources.list.d/google-chrome.list"
            - "sudo rm -f /etc/apt/keyrings/google-chrome.gpg"

  dotfiles:
    depends_on: ["ssh", "tools_linux", "tools_macos"]
    commands:
      - clone:
          url: "git@github.com:timopruesse/.dotfiles.git"
          target: "."
      - symlink:
          force: true
          src: "./home"
          target: "~"
          # Cursor owns ~/.cursor (chats, extensions, state). Agent/command pins
          # + CLI prefs are installed into ~/.cursor by sync scripts.
          ignore: [".cursor"]
      # Regenerate Claude/Cursor agent pins + tier catalog from home/agents/.
      - run:
          install:
            - "./home/agents/sync-agents --no-live"
          update:
            - "./home/agents/sync-agents --no-live"
      # Regenerate Claude/Cursor slash commands + protocol links.
      - run:
          install:
            - "./home/commands/sync-commands --no-live"
          update:
            - "./home/commands/sync-commands --no-live"
      # Install managed paths into ~/.cursor (agents, commands, skills, hooks,
      # rules, cli-config merge) and Claude skills. Cursor owns ~/.cursor —
      # never replace the whole tree.
      - run:
          install:
            - "./home/sync/live-install"
          update:
            - "./home/sync/live-install"

  # Theme files come from the dotfiles symlink; bat itself is already installed
  # by the time dotfiles finishes (dotfiles waits on tools_*).
  bat_theme:
    depends_on: ["dotfiles"]
    commands:
      - run:
          install:
            - "$(command -v batcat || command -v bat) cache --build"
          update:
            - "$(command -v batcat || command -v bat) cache --build"

  lazygit_linux:
    os: ["linux"]
    depends_on: ["dotfiles"]
    commands:
      - run:
          install:
            - "$HOME/install_lazygit.sh"

  neovim_linux:
    os: ["linux"]
    depends_on: ["dotfiles"]
    commands:
      - run:
          # Nightly kept; install_nvim_nightly.sh skips when /opt/nvim matches
          # the GitHub nightly target_commitish stamp.
          install:
            - "$HOME/install_nvim_nightly.sh"
            - "sudo -n luarocks install jsregexp"
          update:
            - "$HOME/install_nvim_nightly.sh"
          uninstall:
            - "sudo -n rm -f /usr/local/bin/nvim"
            - "sudo -n rm -rf /opt/nvim"

  neovim_macos:
    os: ["macos"]
    depends_on: ["tools_macos"]
    commands:
      - run:
          install:
            - "luarocks install jsregexp"
          update:
            - "luarocks install jsregexp"

  rust:
    depends_on: ["tools_linux", "tools_macos"]
    commands:
      - run:
          install:
            - 'if command -v rustup >/dev/null 2>&1; then echo "rustup already installed"; else curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain none -y; fi'
            - "source $HOME/.cargo/env"
            - "rustup toolchain install nightly --allow-downgrade --profile minimal --component clippy"
            - "rustup component add rustfmt --toolchain nightly"
            - "rustup component add rust-analyzer --toolchain nightly"
          update:
            - "rustup update"
      - run:
          # Binary crates via cargo-binstall (no source compile).
          install:
            - 'if command -v cargo-binstall >/dev/null 2>&1; then echo "cargo-binstall already installed"; else curl -L --proto "=https" --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash; fi'
            - "source $HOME/.cargo/env && cargo binstall -y cargo-tarpaulin tree-sitter-cli"
          update:
            - "source $HOME/.cargo/env && cargo binstall -y cargo-tarpaulin tree-sitter-cli"

  # herdr binary/integrations need brew (macOS) or curl (linux) + dotfiles for
  # the pane-context hook. Navigator plugin builds with cargo → herdr_navigator.
  herdr_macos:
    os: ["macos"]
    depends_on: ["tools_macos", "dotfiles"]
    commands:
      - run:
          install:
            - "herdr integration install claude || true"
            - "herdr integration install cursor || true"
            - "mkdir -p \"$HOME/.claude/hooks\""
            - "ln -sfn \"$DOTFILES/home/.claude/hooks/pane-context-aws.sh\" \"$HOME/.claude/hooks/pane-context-aws.sh\""
          update:
            - "herdr integration install claude || true"
            - "herdr integration install cursor || true"
            - "mkdir -p \"$HOME/.claude/hooks\""
            - "ln -sfn \"$DOTFILES/home/.claude/hooks/pane-context-aws.sh\" \"$HOME/.claude/hooks/pane-context-aws.sh\""

  herdr_linux:
    os: ["linux"]
    depends_on: ["tools_linux", "dotfiles"]
    commands:
      - run:
          install:
            - "curl -fsSL https://herdr.dev/install.sh | sh"
          update:
            - "herdr update"
          uninstall:
            - "herdr server stop || true"
            - "rm -f ~/.local/bin/herdr"
            - "rm -rf ~/.local/share/herdr ~/.config/herdr/current"
      - run:
          install:
            - "herdr integration install claude || true"
            - "herdr integration install cursor || true"
            - "mkdir -p \"$HOME/.claude/hooks\""
            - "ln -sfn \"$DOTFILES/home/.claude/hooks/pane-context-aws.sh\" \"$HOME/.claude/hooks/pane-context-aws.sh\""
          update:
            - "herdr integration install claude || true"
            - "herdr integration install cursor || true"
            - "mkdir -p \"$HOME/.claude/hooks\""
            - "ln -sfn \"$DOTFILES/home/.claude/hooks/pane-context-aws.sh\" \"$HOME/.claude/hooks/pane-context-aws.sh\""

  # Cargo-built navigator plugin — only this step waits on rust.
  herdr_navigator:
    depends_on: ["herdr_linux", "herdr_macos", "rust"]
    commands:
      - run:
          install:
            - "herdr plugin install willfish/herdr-navigator --yes || true"
          update:
            - "herdr plugin install willfish/herdr-navigator --yes || true"

  bun:
    commands:
      - run:
          install: "curl -fsSL https://bun.sh/install | bash"
          update: "bun upgrade --canary"

  node_linux:
    os: ["linux"]
    depends_on: ["tools_linux"]
    commands:
      - run:
          # Official binary installer into ~/.local/bin (already on PATH).
          # --skip-shell: .zshrc already runs `fnm env`.
          install:
            - 'curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.local/bin" --skip-shell'
            - 'eval "$(fnm env)" && fnm install --latest && fnm default $(fnm current)'
          update:
            - 'curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.local/bin" --skip-shell'
            - 'eval "$(fnm env)" && fnm install --latest && fnm default $(fnm current) && npm upgrade -g'
          uninstall:
            - "rm -f ~/.local/bin/fnm"
            - "rm -rf ~/.local/share/fnm"

  node_macos:
    os: ["macos"]
    depends_on: ["tools_macos"]
    commands:
      - run:
          install:
            - 'eval "$(fnm env)" && fnm install --latest && fnm default $(fnm current)'
          update:
            - 'eval "$(fnm env)" && fnm install --latest && fnm default $(fnm current) && npm upgrade -g'

  nvim-npm:
    depends_on: ["node_linux", "node_macos"]
    commands:
      - run:
          env:
            PACKAGES_STR: "neovim"
          install: "npm install -g $(echo $PACKAGES_STR)"
          update: "npm upgrade -g $(echo $PACKAGES_STR)"
          uninstall: "npm uninstall -g $(echo $PACKAGES_STR)"

  python_linux:
    os: ["linux"]
    depends_on: ["apt_repos_linux"]
    commands:
      - run:
          install:
            - "sudo apt-get install -y pipx python3-venv python3-pip"
            - "python3 -m pipx ensurepath"
            - "pipx install pip-review"
            - "python3 -m venv $HOME/.local/share/nvim/venv"
            - "$HOME/.local/share/nvim/venv/bin/pip install --upgrade pip pynvim"
          update:
            - "pip-review --auto"
            - "$HOME/.local/share/nvim/venv/bin/pip install --upgrade pynvim"

  python_macos:
    os: ["macos"]
    depends_on: ["tools_macos"]
    commands:
      - run:
          install:
            - "python3 -m pipx ensurepath"
            - "pipx install pip-review"
            - "pipx install pynvim"
          update:
            - "pip-review --auto"

  go_linux:
    os: ["linux"]
    depends_on: ["apt_repos_linux"]
    commands:
      - run:
          install:
            - "sudo apt-get install -y golang"
          update:
            - "sudo apt-get upgrade -y golang"
          uninstall:
            - "sudo apt-get remove -y golang"

  docker:
    os: ["linux"]
    depends_on: ["apt_repos_linux"]
    commands:
      - run:
          install:
            - "sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
            - "sudo usermod -aG docker $USER"
          update:
            - "sudo apt-get upgrade -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
          uninstall:
            - "sudo apt-get remove -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
            - "sudo rm -f /etc/apt/sources.list.d/docker.sources"
            - "sudo rm -f /etc/apt/keyrings/docker.asc"

  aws_cli_linux:
    os: ["linux"]
    depends_on: ["tools_linux"]
    commands:
      - run:
          env:
            TMP_DIR: "/tmp/awscli-install"
          install:
            - 'if command -v aws >/dev/null 2>&1; then echo "aws already installed: $(aws --version 2>&1)"; else mkdir -p "$TMP_DIR" && curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$TMP_DIR/awscliv2.zip" && unzip -o "$TMP_DIR/awscliv2.zip" -d "$TMP_DIR" && sudo "$TMP_DIR/aws/install" && rm -rf "$TMP_DIR"; fi'
          update:
            - "mkdir -p $TMP_DIR"
            - 'curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$TMP_DIR/awscliv2.zip"'
            - "unzip -o $TMP_DIR/awscliv2.zip -d $TMP_DIR"
            - "sudo $TMP_DIR/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update"
            - "rm -rf $TMP_DIR"
          uninstall:
            - "sudo rm -f /usr/local/bin/aws"
            - "sudo rm -f /usr/local/bin/aws_completer"
            - "sudo rm -rf /usr/local/aws-cli"

  # Claude Code CLI. Native installer (cross-platform) → ~/.local/bin (already on
  # PATH); auto-updates in the background. Re-run the installer to update, same
  # rationale as cursor_cli. Previously unmanaged — .zshrc/aliases assumed it on
  # PATH.
  claude_cli:
    commands:
      - run:
          install: "curl -fsSL https://claude.ai/install.sh | bash"
          update: "curl -fsSL https://claude.ai/install.sh | bash"
          uninstall:
            - "rm -f ~/.local/bin/claude"
            - "rm -rf ~/.local/share/claude"

  # Cursor CLI (cursor-agent). Cross-platform installer → ~/.local/bin (already
  # on PATH). Re-run the installer to update: machine_setup's run-shell may not
  # have the .zshrc PATH, and it's idempotent — same pattern as neovim.
  cursor_cli:
    commands:
      - run:
          install: "curl https://cursor.com/install -fsS | bash"
          update: "curl https://cursor.com/install -fsS | bash"

  font_linux:
    os: ["linux"]
    depends_on: ["tools_linux"]
    commands:
      - run:
          env:
            FONT_DIR: "$HOME/.local/share/fonts/MesloLGS"
            TMP_ZIP: "/tmp/meslo-nf.zip"
          install:
            - 'if find "$FONT_DIR" -type f \( -name "*.ttf" -o -name "*.otf" \) 2>/dev/null | grep -q .; then echo "Meslo fonts already installed"; else mkdir -p "$FONT_DIR" && curl -fL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Meslo.zip -o "$TMP_ZIP" && unzip -o "$TMP_ZIP" -d "$FONT_DIR" && rm -f "$TMP_ZIP" && fc-cache -fv; fi'
          update:
            - "mkdir -p $FONT_DIR"
            - "curl -fL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Meslo.zip -o $TMP_ZIP"
            - "unzip -o $TMP_ZIP -d $FONT_DIR"
            - "rm $TMP_ZIP"
            - "fc-cache -fv"

  personal_repos:
    depends_on: ["ssh", "tools_linux", "tools_macos"]
    commands:
      - machine_setup:
          config: "$DOTFILES/personal_repositories.yaml"
